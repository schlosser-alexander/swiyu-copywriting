name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(jq -r .version plugins/swiyu-copywriting/.claude-plugin/plugin.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi

      - name: Build zips
        run: |
          mkdir -p dist
          # Skill upload: the zip root is the skill folder, named after the skill.
          (cd plugins/swiyu-copywriting/skills && zip -r -X "$GITHUB_WORKSPACE/dist/swiyu-copywriting-skill.zip" swiyu-copywriting)
          # Plugin upload: the zip holds the plugin folder's contents, including .claude-plugin/plugin.json.
          (cd plugins/swiyu-copywriting && zip -r -X "$GITHUB_WORKSPACE/dist/swiyu-copywriting.plugin" .claude-plugin skills)

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
